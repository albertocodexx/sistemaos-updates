# Configuração local, sem chaves ou segredos.
project_id = "sistema-os-at"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[functions.auth-login]
verify_jwt = false

[functions.admin-global]
verify_jwt = true

[functions.integracoes-empresa]
verify_jwt = true

[functions.assinaturas-remotas]
verify_jwt = true

[functions.assinaturas-saas]
verify_jwt = true

[functions.mercado-pago-saas-webhook]
verify_jwt = false

[functions.assinaturas-worker]
verify_jwt = false

[functions.fiscal-documentos]
verify_jwt = true

[functions.fiscal-documentos-provedor]
verify_jwt = false

[analytics]
enabled = true
port = 54327
backend = "postgres"
