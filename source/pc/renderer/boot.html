<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sistema OS</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif;background:#080808;color:#f7f7f5}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;background:#080808;user-select:none}
    main{width:100%;height:100%;padding:34px 38px 30px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #242424;background:#0b0b0b}
    .marca{display:flex;align-items:center;gap:13px}.marca img{width:38px;height:38px;object-fit:contain}.marca strong{font-size:16px;letter-spacing:-.02em}.marca span{display:block;margin-top:2px;color:#858585;font-size:11px}
    .estado{margin:26px 0 23px}.estado h1{margin:0 0 8px;font-size:27px;line-height:1.08;letter-spacing:-.045em;font-weight:650}.estado p{min-height:20px;margin:0;color:#aaa;font-size:12px}
    .progresso-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#8c8c8c;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.progresso-trilho{height:2px;background:#292929;overflow:hidden}.progresso-barra{width:8%;height:100%;background:#fff;transition:width .24s cubic-bezier(.22,.61,.36,1)}
    footer{color:#707070;font-size:10px;line-height:1.45;border-top:1px solid #202020;padding-top:13px}
    @media (prefers-reduced-motion:reduce){.progresso-barra{transition:none}}
  </style>
</head>
<body>
  <main>
    <div class="marca"><img src="../assets/tray-icon.png" alt=""><div><strong>Sistema OS</strong><span>Gestão para assistência técnica</span></div></div>
    <section class="estado" role="status" aria-live="polite"><h1>Preparando seu ambiente</h1><p id="status">Carregando recursos locais…</p></section>
    <div>
      <div class="progresso-topo"><span>Inicialização</span><b id="percentual">8%</b></div>
      <div class="progresso-trilho" role="progressbar" aria-label="Progresso da abertura" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8"><div id="barra" class="progresso-barra"></div></div>
      <footer>Mensagens, sincronização e lembretes continuam ativos quando a janela está recolhida.</footer>
    </div>
  </main>
  <script>
    window.SistemaOSBoot={atualizar:function(valor,texto){var n=Math.max(0,Math.min(100,Number(valor)||0));document.getElementById('barra').style.width=n+'%';document.getElementById('percentual').textContent=Math.round(n)+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',String(Math.round(n)));if(texto)document.getElementById('status').textContent=texto;}};
  </script>
</body>
</html>
