// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    // Mantém todos os artefatos transitórios dentro deste projeto Android.
    // Evita que plugins resolvidos por junction gravem caches no OneDrive,
    // onde indexadores podem travar diretórios durante a compilação.
    buildDir = new File(rootProject.projectDir, ".build/${project.name}")
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
